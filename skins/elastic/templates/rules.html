<roundcube:include file="includes/layout.html" />
<roundcube:include file="includes/menu.html" />
<roundcube:include file="includes/settings-menu.html" />

<h1 class="voice"><roundcube:label name="settings" /> : <roundcube:label name="hms_rules.rules" /></h1>

<!-- rules list -->
<div id="layout-list" class="listbox selected" aria-labelledby="aria-label-ruleslist">
	<div class="header">
		<a class="button icon back-sidebar-button" href="#sidebar"><span class="inner"><roundcube:label name="settings" /></span></a>
		<span id="aria-label-ruleslist" class="header-title"><roundcube:label name="hms_rules.rules" /></span>
		<a class="button icon toolbar-menu-button" href="#list-menu"><span class="inner"><roundcube:label name="menu" /></span></a>
	</div>
	<div class="scroller">
		<roundcube:object name="ruleslist" id="identities-table" class="listing iconized rules-list"
			noheader="true" role="listbox" data-list="identity_list"
			data-label-msg="listempty" data-label-ext="listusebutton" data-create-command="plugin.hmsrules-add" />
	</div>
	<div class="footer"></div>
</div>

<!-- rules details frame -->
<div id="layout-content" role="main">
	<h2 id="aria-label-toolbar" class="voice"><roundcube:label name="arialabeltoolbar" /></h2>
	<div class="header" role="toolbar" aria-labelledby="aria-label-toolbar">
		<a class="button icon back-list-button" href="#back"><span class="inner"><roundcube:label name="back" /></span></a>
		<span class="header-title"></span>
		<!-- toolbar -->
		<ul id="toolbar-menu" class="menu toolbar">
			<roundcube:button command="plugin.hmsrules-add" type="link"
				title="hms_rules.newrule" class="create disabled"
				classAct="create" innerClass="inner" label="create" data-fab="true" />
			<roundcube:button command="plugin.hmsrules-delete" type="link"
				title="delete" class="delete disabled" classAct="delete"
				innerClass="inner" label="delete" />
			<roundcube:button command="plugin.hmsrules-moveup" type="link"
				title="hms_rules.moveup" class="moveup disabled"
				classAct="moveup" innerClass="inner" label="hms_rules.moveup" />
			<roundcube:button command="plugin.hmsrules-movedown" type="link"
				title="hms_rules.movedown" class="movedown disabled"
				classAct="movedown" innerClass="inner" label="hms_rules.movedown" />
		</ul>
	</div>
	<h2 id="aria-label-rulesframe" class="voice"><roundcube:label name="hms_rules.editrulefromtitle" /></h2>
	<div class="iframe-wrapper">
		<roundcube:object name="ruleframe" id="content-frame" src="/watermark.html" title="hms_rules.editrulefromtitle" />
	</div>
</div>

<roundcube:include file="includes/footer.html" />
